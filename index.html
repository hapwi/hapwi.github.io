<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <meta
      name="theme-color"
      content="#fbfbfc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111318"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Open-source tools by hapwi for working across macOS and Linux, with one-line installers, hosted Discord themes, and userscripts."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>hapwi — open-source tools</title>
  </head>
  <body>
    <script>
      ;(function () {
        var theme = localStorage.getItem('vite-ui-theme')
        var isDark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches) ||
          (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var d = document.documentElement
        if (isDark) {
          d.classList.add('dark')
          d.style.colorScheme = 'dark'
          d.style.backgroundColor = '#111318'
        } else {
          d.classList.add('light')
          d.style.colorScheme = 'light'
          d.style.backgroundColor = '#fbfbfc'
        }
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
