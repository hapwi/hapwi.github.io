name: Deploy static content to Pages

on:
  push:
    branches: ['master']
  schedule:
    - cron: '17 8 * * *'
  repository_dispatch:
    types: [hub-sync]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version-file: '.node-version'
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Sync catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vp run sync

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vp run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
